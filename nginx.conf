events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream wedding_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name eug-jul-wedding.ru www.eug-jul-wedding.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name eug-jul-wedding.ru www.eug-jul-wedding.ru;

    ssl_certificate     /etc/letsencrypt/live/eug-jul-wedding.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eug-jul-wedding.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    root /var/www/wedding-site;
    index index.html;

    access_log /var/log/nginx/wedding-access.log;
    error_log  /var/log/nginx/wedding-error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript;

    # Корень и любые неизвестные пути отдаёт приложение (Node),
    # nginx НЕ раздаёт произвольные файлы из root напрямую —
    # иначе server.js, rsvp.db, package.json и т.п. утекают наружу.
    location / {
        proxy_pass http://wedding_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Жёстко запрещаем доступ к серверным/чувствительным файлам,
    # даже если они физически лежат в root.
    location ~* \.(db|db-shm|db-wal|env|json|md|conf|lock|log)$ {
        deny all;
        return 404;
    }
    location = /server.js {
        deny all;
        return 404;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    location @proxy {
        proxy_pass http://wedding_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://wedding_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        limit_except GET POST {
            deny all;
        }
    }

    location = /app.js {
        expires 1d;
        add_header Cache-Control "public, immutable";
        try_files $uri @proxy;
    }

    location /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
}
